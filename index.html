<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXT-runner — a Forth threaded-code walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg:        #1c2028;
    --bg-card:   #242933;
    --panel:     #2e3440;
    --panel-hi:  #3b4252;
    --border:    #3b4252;
    --border-hi: #4c566a;
    --text:      #eceff4;
    --text-mid:  #d8dee9;
    --text-dim:  #7b8493;
    --text-vdim: #4c566a;
    --ip:        #88c0d0;
    --ip-deep:   #5e81ac;
    --stack:     #d08770;
    --hop:       #b48ead;
    --exec:      #ebcb8b;
    --ok:        #a3be8c;
    --red:       #bf616a;
    --frost:     #8fbcbb;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Segoe UI Symbol', 'Apple Symbols', 'Symbola', 'DejaVu Sans Mono', ui-monospace, SFMono-Regular, monospace;
    overflow: hidden;
    user-select: none;
  }
  #root { width: 100vw; height: 100vh; display: flex; align-items: stretch; justify-content: center; }
  kbd {
    display: inline-block;
    padding: 1px 7px;
    background: var(--panel-hi);
    border: 1px solid var(--border-hi);
    border-bottom-width: 2px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    min-width: 18px;
    text-align: center;
    line-height: 16px;
  }
  /* scanline effect */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 2px,
      rgba(255,255,255,0.012) 2px,
      rgba(255,255,255,0.012) 3px
    );
    pointer-events: none;
    z-index: 999;
  }
  /* subtle vignette */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
    pointer-events: none;
    z-index: 998;
  }
  /* highlight pulse for newly-changed elements */
  @keyframes pulse-exec {
    0%   { box-shadow: 0 0 0 0 rgba(235,203,139,0.6), inset 0 0 0 1px rgba(235,203,139,0.7); background-color: rgba(235,203,139,0.18); }
    100% { box-shadow: 0 0 0 4px rgba(235,203,139,0),  inset 0 0 0 1px rgba(235,203,139,0.35); background-color: rgba(235,203,139,0.08); }
  }
  @keyframes pulse-stack {
    0%   { box-shadow: 0 0 0 0 rgba(208,135,112,0.7); transform: scale(1.04); }
    100% { box-shadow: 0 0 0 8px rgba(208,135,112,0); transform: scale(1); }
  }
  @keyframes pulse-hop {
    0%   { box-shadow: 0 0 0 0 rgba(180,142,173,0.7); border-color: rgba(180,142,173,1); }
    100% { box-shadow: 0 0 0 6px rgba(180,142,173,0); border-color: rgba(180,142,173,0.6); }
  }
  @keyframes ip-blink {
    0%, 60% { opacity: 1; }
    61%, 100% { opacity: 0.4; }
  }
  @keyframes star-pop {
    0%   { transform: scale(0) rotate(-90deg); opacity: 0; }
    60%  { transform: scale(1.4) rotate(20deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes confetti-drop {
    from { transform: translateY(-20px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  .blink-cursor { animation: ip-blink 0.9s infinite step-end; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="steps.jsx"></script>
<script type="text/babel" src="tui.jsx"></script>
</body>
</html>
